      <h2>Trabalho de Média</h2>
      <p>Este trabalho calcula a média das notas de um estudante e mostra o conceito correspondente.</p>

      <script>
        let nota1 = parseInt(prompt("Digite a primeira nota:"));
        let nota2 = parseInt(prompt("Digite a segunda nota:"));
        let media = (nota1 + nota2) / 2;
        media = Math.floor(media);

        let conceito;
        switch (true) {
          case (media >= 9): conceito = "A"; break;
          case (media >= 7): conceito = "B"; break;
          case (media >= 5): conceito = "C"; break;
          case (media >= 3): conceito = "D"; break;
          case (media >= 0): conceito = "E"; break;
          default: conceito = "Nota inválida!";
        }

        alert("Média: " + media + " - Conceito: " + conceito);
      </script>
